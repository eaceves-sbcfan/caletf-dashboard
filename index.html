/* ═══════════════ MATCHING ENGINE ═══════════════ */

function matchRecommendations(profile) {
  const { roles, identities, challenges, locations } = profile;
  const scored = [];
  SECTIONS.forEach(section => {
    section.recs.forEach(rec => {
      let score = 0; let reasons = [];
      if (roles.includes("tribal_member")) {
        if (["1.1","1.2","1.3","1.4"].includes(rec.id)) { score += 10; reasons.push(R.tribalDirect); }
        if (["2.1","2.3","2.5","3.2"].includes(rec.id)) { score += 7; reasons.push(R.tribalFunding); }
        if (["4.2","5.4"].includes(rec.id)) { score += 5; reasons.push(R.tribalGuidelines); }
      }
      if (roles.includes("current_farmer") || roles.includes("large_farmer")) {
        if (["3.1","3.2","3.4"].includes(rec.id)) { score += 7; reasons.push(R.antiConsolidation); }
        if (["5.1","5.2","5.3","5.4"].includes(rec.id)) { score += 8; reasons.push(R.tenureSecurity); }
        if (["4.1","4.2","4.3"].includes(rec.id)) { score += 5; reasons.push(R.preservesLand); }
      }
      if (roles.includes("current_farmer")) {
        if (["5.4"].includes(rec.id)) { score += 4; reasons.push(R.tieredCompliance); }
        if (["2.6"].includes(rec.id)) { score += 5; reasons.push(R.setAsides); }
      }
      if (roles.includes("farmworker")) {
        if (["2.7"].includes(rec.id)) { score += 9; reasons.push(R.farmworkerTransition); }
        if (["5.5"].includes(rec.id)) { score += 8; reasons.push(R.farmworkerHousing); }
        if (["5.4"].includes(rec.id)) { score += 6; reasons.push(R.oshaTraining); }
        if (["2.1","2.4"].includes(rec.id)) { score += 7; reasons.push(R.grantsLoans); }
        if (["2.2"].includes(rec.id)) { score += 4; reasons.push(R.laborExploitation); }
      }
      if (roles.includes("aspiring_farmer")) {
        if (["2.1","2.3","2.4"].includes(rec.id)) { score += 10; reasons.push(R.directFunding); }
        if (["2.7"].includes(rec.id)) { score += 8; reasons.push(R.techAssist); }
        if (["3.2"].includes(rec.id)) { score += 8; reasons.push(R.firstPurchase); }
        if (["4.4"].includes(rec.id)) { score += 7; reasons.push(R.publicLeasing); }
        if (["2.5"].includes(rec.id)) { score += 6; reasons.push(R.taxCredits); }
      }
      if (roles.includes("urban_grower")) {
        if (["6.1","6.2"].includes(rec.id)) { score += 10; reasons.push(R.urbanDirect); }
        if (["2.6"].includes(rec.id)) { score += 5; reasons.push(R.urbanEligibility); }
        if (["5.5"].includes(rec.id)) { score += 4; reasons.push(R.urbanZoning); }
      }
      if (roles.includes("tenant_farmer")) {
        if (["5.1"].includes(rec.id)) { score += 10; reasons.push(R.billOfRights); }
        if (["5.2","5.3"].includes(rec.id)) { score += 6; reasons.push(R.ombudsEquity); }
        if (["4.4"].includes(rec.id)) { score += 7; reasons.push(R.modelLeases); }
        if (["2.3"].includes(rec.id)) { score += 7; reasons.push(R.leaseToOwn); }
      }
      if (roles.includes("retiring_farmer")) {
        if (["3.3"].includes(rec.id)) { score += 10; reasons.push(R.retirementFund); }
        if (["2.5"].includes(rec.id)) { score += 7; reasons.push(R.successionTax); }
        if (["3.2"].includes(rec.id)) { score += 5; reasons.push(R.priorityTransfer); }
      }
      if (roles.includes("landowner_nonfarm")) {
        if (["2.5"].includes(rec.id)) { score += 8; reasons.push(R.taxSellLease); }
        if (["4.2","4.3"].includes(rec.id)) { score += 5; reasons.push(R.easements); }
        if (["3.4"].includes(rec.id)) { score += 4; reasons.push(R.marketTransparency); }
      }
      if (roles.includes("advocate")) {
        if (["3.4"].includes(rec.id)) { score += 7; reasons.push(R.advocacyData); }
        if (["2.2"].includes(rec.id)) { score += 7; reasons.push(R.advocacyResearch); }
        if (["2.6"].includes(rec.id)) { score += 6; reasons.push(R.advocacyMetrics); }
        if (["5.2"].includes(rec.id)) { score += 6; reasons.push(R.advocacyOffice); }
      }
      if (identities.includes("indigenous")) {
        if (["1.1","1.2","1.3","1.4"].includes(rec.id)) { score += 8; reasons.push(R.indigenousSovereignty); }
        if (["2.5"].includes(rec.id)) { score += 4; reasons.push(R.tribalTaxExempt); }
      }
      if (identities.includes("black")) {
        if (["2.1"].includes(rec.id)) { score += 8; reasons.push(R.blackSetAside); }
        if (["2.2"].includes(rec.id)) { score += 6; reasons.push(R.blackHistory); }
      }
      if (identities.includes("latino")) {
        if (["2.7"].includes(rec.id)) { score += 5; reasons.push(R.spanishServices); }
        if (["5.4"].includes(rec.id)) { score += 4; reasons.push(R.latinoTraining); }
      }
      if (identities.includes("asian")) {
        if (["2.1","2.2"].includes(rec.id)) { score += 5; reasons.push(R.alienLandLaws); }
        if (["2.7"].includes(rec.id)) { score += 4; reasons.push(R.asianServices); }
      }
      if (identities.includes("nhpi")) {
        if (["2.1","2.6"].includes(rec.id)) { score += 5; reasons.push(R.nhpiSetAside); }
      }
      const isBIPOC = identities.some(id => ["indigenous","black","latino","asian","nhpi","multiracial"].includes(id));
      if (isBIPOC) {
        if (["2.6"].includes(rec.id)) { score += 3; reasons.push(R.bipocSetAsides); }
        if (["5.2"].includes(rec.id)) { score += 3; reasons.push(R.bipocAuthority); }
      }
      if (challenges.includes("cant_afford")) {
        if (["2.1","2.3","2.4"].includes(rec.id)) { score += 6; reasons.push(R.affordDirect); }
        if (["3.1","3.2"].includes(rec.id)) { score += 4; reasons.push(R.affordCompetition); }
      }
      if (challenges.includes("insecure_lease")) {
        if (["5.1"].includes(rec.id)) { score += 8; reasons.push(R.leaseProtection); }
        if (["4.4"].includes(rec.id)) { score += 4; reasons.push(R.fairLeaseStandards); }
      }
      if (challenges.includes("regulatory_burden")) { if (["5.2","5.3","5.4"].includes(rec.id)) { score += 7; reasons.push(R.regCoordination); } }
      if (challenges.includes("water_access")) {
        if (["5.4"].includes(rec.id)) { score += 7; reasons.push(R.sgmaWater); }
        if (["6.1"].includes(rec.id)) { score += 5; reasons.push(R.urbanWater); }
      }
      if (challenges.includes("no_housing")) { if (["5.5"].includes(rec.id)) { score += 9; reasons.push(R.diverseHousing); } }
      if (challenges.includes("credit_denied")) {
        if (["2.4"].includes(rec.id)) { score += 8; reasons.push(R.pilotLending); }
        if (["2.1"].includes(rec.id)) { score += 5; reasons.push(R.grantsBypass); }
      }
      if (challenges.includes("language_barrier")) {
        if (["2.7"].includes(rec.id)) { score += 8; reasons.push(R.multilingualTA); }
        if (["5.4"].includes(rec.id)) { score += 4; reasons.push(R.multilingualPest); }
      }
      if (challenges.includes("consolidation_pressure")) { if (["3.1","3.2","3.3","3.4"].includes(rec.id)) { score += 7; reasons.push(R.counterConsolidation); } }
      if (challenges.includes("succession")) {
        if (["2.5"].includes(rec.id)) { score += 8; reasons.push(R.successionReform); }
        if (["3.3"].includes(rec.id)) { score += 7; reasons.push(R.retirementTransition); }
      }
      if (challenges.includes("zoning")) {
        if (["5.5"].includes(rec.id)) { score += 8; reasons.push(R.zoningReform); }
        if (["1.4"].includes(rec.id)) { score += 4; reasons.push(R.culturalZoning); }
      }
      if (challenges.includes("cultural_practices")) {
        if (["1.4"].includes(rec.id)) { score += 9; reasons.push(R.culturalFire); }
        if (["4.2"].includes(rec.id)) { score += 4; reasons.push(R.conservationGuidelines); }
      }
      if (challenges.includes("urban_exclusion")) {
        if (["6.1","6.2"].includes(rec.id)) { score += 9; reasons.push(R.urbanExclusion); }
        if (["2.6"].includes(rec.id)) { score += 4; reasons.push(R.revisedEligibility); }
      }
      if (locations.includes("urban")) {
        if (["6.1","6.2"].includes(rec.id)) { score += 5; reasons.push(R.urbanPrograms); }
        if (["5.5"].includes(rec.id)) { score += 2; reasons.push(R.urbanEdgeZoning); }
      }
      if (locations.includes("tribal_land")) { if (["1.1","1.2","1.3","1.4"].includes(rec.id)) { score += 5; reasons.push(R.tribalGovernance); } }
      if (locations.includes("rural")) {
        if (["4.1","4.2","4.3"].includes(rec.id)) { score += 3; reasons.push(R.ruralPreservation); }
        if (["3.1","3.4"].includes(rec.id)) { score += 3; reasons.push(R.ruralMonitoring); }
      }
      if (locations.includes("periurban")) {
        if (["4.3"].includes(rec.id)) { score += 6; reasons.push(R.periurbanBoundaries); }
        if (["4.1"].includes(rec.id)) { score += 3; reasons.push(R.periurbanPlan); }
      }
      const uniqueReasons = [...new Map(reasons.map(r => [r.en, r])).values()];
      if (score > 0) scored.push({ rec, section, score, reasons: uniqueReasons });
    });
  });
  scored.sort((a, b) => b.score - a.score);
  return scored;
}

function LangToggle({ lang, setLang }) {
  return (
    <button onClick={() => setLang(lang === "en" ? "es" : "en")} style={{
      position: "fixed", top: "16px", right: "16px", zIndex: 100,
      background: "linear-gradient(135deg, #2c1810, #4a3728)",
      border: "2px solid rgba(232,169,82,0.4)", borderRadius: "30px",
      padding: "8px 18px", cursor: "pointer",
      display: "flex", alignItems: "center", gap: "8px",
      boxShadow: "0 4px 20px rgba(0,0,0,0.25)",
      transition: "all 0.3s ease",
    }}
      onMouseEnter={e => e.currentTarget.style.borderColor = "#E8A952"}
      onMouseLeave={e => e.currentTarget.style.borderColor = "rgba(232,169,82,0.4)"}
    >
      <span style={{ fontSize: "16px" }}>{lang === "en" ? "🇺🇸" : "🇲🇽"}</span>
      <span style={{ color: "#E8A952", fontSize: "13px", fontWeight: 700, fontFamily: "'DM Sans', sans-serif", letterSpacing: "0.5px" }}>
        {lang === "en" ? "ES" : "EN"}
      </span>
    </button>
  );
}

function BarChart({ data }) {
  const lang = useLang();
  const maxPct = Math.max(...data.map(d => d.pct));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
      {data.map((d, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: "12px" }}>
          <div style={{ width: "200px", textAlign: "right", fontSize: "13px", fontFamily: "'Source Serif 4', Georgia, serif", color: "#4a3728", flexShrink: 0 }}>{t(d.group, lang)}</div>
          <div style={{ flex: 1, background: "#e8ddd0", borderRadius: "4px", height: "28px", overflow: "hidden" }}>
            <div style={{ width: `${(d.pct / maxPct) * 100}%`, height: "100%", background: `linear-gradient(90deg, ${d.color}, ${d.color}cc)`, borderRadius: "4px", transition: "width 1.5s cubic-bezier(0.22, 1, 0.36, 1)", display: "flex", alignItems: "center", justifyContent: "flex-end", paddingRight: "8px", minWidth: d.pct < 2 ? "50px" : undefined }}>
              <span style={{ color: "#fff", fontSize: "12px", fontWeight: 700, textShadow: "0 1px 2px rgba(0,0,0,0.3)" }}>{d.pct}%</span>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function DonutChart() {
  const lang = useLang();
  const total = 26; let cumulative = 0; const radius = 80; const circumference = 2 * Math.PI * radius;
  const sections = SECTIONS.map(s => ({ ...s, pct: (s.recCount / total) * 100 }));
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "24px", justifyContent: "center", flexWrap: "wrap" }}>
      <svg width="200" height="200" viewBox="0 0 200 200">
        {sections.map((s, i) => { const dl = (s.pct / 100) * circumference; const doff = -(cumulative / 100) * circumference; cumulative += s.pct; return <circle key={i} cx="100" cy="100" r={radius} fill="none" stroke={s.color} strokeWidth="28" strokeDasharray={`${dl} ${circumference - dl}`} strokeDashoffset={doff} />; })}
        <text x="100" y="95" textAnchor="middle" style={{ fontSize: "32px", fontWeight: 800, fill: "#2c1810", fontFamily: "'Source Serif 4', Georgia, serif" }}>26</text>
        <text x="100" y="118" textAnchor="middle" style={{ fontSize: "12px", fill: "#7a6b5d", fontFamily: "'Source Serif 4', Georgia, serif" }}>{t(UI.totalRecs, lang)}</text>
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
        {sections.map((s, i) => (<div key={i} style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "13px", fontFamily: "'Source Serif 4', Georgia, serif" }}><div style={{ width: "12px", height: "12px", borderRadius: "3px", background: s.color, flexShrink: 0 }} /><span style={{ color: "#4a3728" }}>{s.icon} {t(UI.sec, lang)} {s.id}: {s.recCount}</span></div>))}
      </div>
    </div>
  );
}

function RecDetail({ section }) {
  const lang = useLang();
  return (
    <div style={{ background: "#faf6f0", border: "2px solid #e8ddd0", borderRadius: "16px", padding: "28px", animation: "fadeSlideIn 0.5s ease" }}>

function PersonalImpactSection() {
  const lang = useLang();
  const [step, setStep] = useState(0);
  const [profile, setProfile] = useState({ roles: [], identities: [], challenges: [], locations: [] });
  const [results, setResults] = useState(null);
  const toggle = (field, id) => setProfile(prev => ({ ...prev, [field]: prev[field].includes(id) ? prev[field].filter(x => x !== id) : [...prev[field], id] }));
  const canProceed = () => { if (step === 0) return profile.roles.length > 0; if (step === 1) return profile.identities.length > 0; if (step === 2) return profile.challenges.length > 0; if (step === 3) return profile.locations.length > 0; return false; };
  const handleAnalyze = () => { setResults(matchRecommendations(profile)); setStep(5); };
  const steps = [
    { title: UI.roleTitle, subtitle: UI.roleSubtitle, field: "roles", options: PROFILE_OPTIONS.role },
    { title: UI.identityTitle, subtitle: UI.identitySubtitle, field: "identities", options: PROFILE_OPTIONS.identity },
    { title: UI.challengeTitle, subtitle: UI.challengeSubtitle, field: "challenges", options: PROFILE_OPTIONS.challenges },
    { title: UI.locationTitle, subtitle: UI.locationSubtitle, field: "locations", options: PROFILE_OPTIONS.location },
  ];
  const stepLabels = [UI.stepRole, UI.stepIdentity, UI.stepChallenges, UI.stepLocation];
  if (step === 5 && results) return (
    <div style={{ animation: "fadeIn 0.5s ease" }}>
      <button onClick={() => { setStep(0); setResults(null); setProfile({ roles: [], identities: [], challenges: [], locations: [] }); }} style={{ background: "none", border: "1px solid #c9b99a", borderRadius: "10px", padding: "8px 18px", cursor: "pointer", fontSize: "13px", color: "#7a6b5d", fontFamily: "'DM Sans', sans-serif", marginBottom: "20px" }}>{t(UI.startOver, lang)}</button>
      <ImpactResults results={results} />
    </div>
  );
  const cur = steps[step] || steps[0];
  return (
    <div style={{ animation: "fadeIn 0.5s ease" }}>
      <h2 style={{ fontSize: "26px", fontWeight: 800, color: "#2c1810", margin: "0 0 4px", fontFamily: "'Source Serif 4', Georgia, serif" }}>{t(UI.impactTitle, lang)}</h2>
      <p style={{ fontSize: "14px", color: "#7a6b5d", marginBottom: "24px", fontFamily: "'Source Serif 4', Georgia, serif" }}>{t(UI.impactDesc, lang)}</p>
      <div style={{ display: "flex", gap: "6px", marginBottom: "28px" }}>
        {[0, 1, 2, 3].map(i => (<div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", gap: "6px" }}><div style={{ height: "4px", borderRadius: "2px", background: i < step ? "linear-gradient(90deg, #2D5016, #4A7C23)" : i === step ? "linear-gradient(90deg, #8B4513, #D2691E)" : "#e0d5c5" }} /><div style={{ fontSize: "11px", fontFamily: "'DM Sans', sans-serif", color: i <= step ? "#2c1810" : "#b5a898", fontWeight: i === step ? 700 : 400 }}>{t(stepLabels[i], lang)}</div></div>))}
      </div>
      <div key={step} style={{ background: "#faf6f0", border: "2px solid #e8ddd0", borderRadius: "20px", padding: "28px", marginBottom: "20px", animation: "fadeSlideIn 0.4s ease" }}>
        <h3 style={{ margin: "0 0 6px", fontSize: "20px", fontWeight: 700, color: "#2c1810", fontFamily: "'Source Serif 4', Georgia, serif" }}>{t(cur.title, lang)}</h3>
        <p style={{ fontSize: "13px", color: "#7a6b5d", margin: "0 0 20px", fontFamily: "'Source Serif 4', Georgia, serif", lineHeight: 1.5 }}>{t(cur.subtitle, lang)}</p>
        <ChipSelect options={cur.options} selected={profile[cur.field]} onToggle={(id) => toggle(cur.field, id)} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", gap: "12px" }}>
        {step > 0 ? <button onClick={() => setStep(s => s - 1)} style={{ background: "none", border: "1px solid #c9b99a", borderRadius: "12px", padding: "12px 24px", cursor: "pointer", fontSize: "14px", color: "#5a4a3a", fontFamily: "'DM Sans', sans-serif", fontWeight: 600 }}>{t(UI.back, lang)}</button> : <div />}
        {step < 3 ? <button onClick={() => canProceed() && setStep(s => s + 1)} style={{ background: canProceed() ? "linear-gradient(135deg, #2D5016, #4A7C23)" : "#d5ccc0", border: "none", borderRadius: "12px", padding: "12px 28px", cursor: canProceed() ? "pointer" : "not-allowed", fontSize: "14px", color: "#fff", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, boxShadow: canProceed() ? "0 4px 16px rgba(45,80,22,0.25)" : "none" }}>{t(UI.continue, lang)}</button>
        : <button onClick={() => canProceed() && handleAnalyze()} style={{ background: canProceed() ? "linear-gradient(135deg, #8B4513, #D2691E)" : "#d5ccc0", border: "none", borderRadius: "12px", padding: "12px 28px", cursor: canProceed() ? "pointer" : "not-allowed", fontSize: "14px", color: "#fff", fontFamily: "'DM Sans', sans-serif", fontWeight: 700, boxShadow: canProceed() ? "0 4px 16px rgba(139,69,19,0.3)" : "none" }}>{t(UI.analyze, lang)}</button>}
      </div>
    </div>
  );
}

            </h1>
            <p style={{ fontSize: "16px", color: "#c9b99a", maxWidth: "600px", lineHeight: 1.6, margin: "0 0 20px", animation: "slideUp 0.8s ease 0.15s both" }}>{t(UI.heroDesc, lang)}</p>
            <a href="https://sgc.ca.gov/wp-content/uploads/ALETF-Final-Report_Dec-11-2025.pdf" target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: "8px", background: "linear-gradient(135deg, #E8A952, #D2691E)", color: "#2c1810", padding: "10px 22px", borderRadius: "30px", fontSize: "14px", fontWeight: 700, fontFamily: "'DM Sans', sans-serif", textDecoration: "none", boxShadow: "0 4px 16px rgba(232,169,82,0.3)", transition: "all 0.3s ease", marginBottom: "28px", animation: "slideUp 0.8s ease 0.2s both" }} onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 24px rgba(232,169,82,0.4)"; }} onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 16px rgba(232,169,82,0.3)"; }}>📄 {t(UI.readReport, lang)} ↗</a>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: "12px", animation: "slideUp 0.8s ease 0.3s both" }}>
              {heroStats.map((s, i) => (<div key={i} style={{ background: "rgba(255,255,255,0.07)", backdropFilter: "blur(10px)", borderRadius: "14px", padding: "16px", border: "1px solid rgba(255,255,255,0.08)", textAlign: "center" }}><div style={{ fontSize: "24px", marginBottom: "4px" }}>{s.icon}</div><div style={{ fontSize: "28px", fontWeight: 800, color: "#faf6f0", fontFamily: "'DM Sans', sans-serif" }}>{s.value}</div><div style={{ fontSize: "11px", color: "#c9b99a", letterSpacing: "0.5px" }}>{t(s.label, lang)}</div></div>))}
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{ maxWidth: "1000px", margin: "0 auto", padding: "0 24px", position: "sticky", top: 0, zIndex: 10, background: "linear-gradient(180deg, #f5efe6 80%, transparent)", paddingTop: "16px", paddingBottom: "8px" }}>
          <div style={{ display: "flex", gap: "4px", background: "#e8ddd0", borderRadius: "12px", padding: "4px", overflowX: "auto" }}>
            {TABS.map(tb => (<button key={tb.id} onClick={() => setTab(tb.id)} style={{ flex: 1, padding: "10px 14px", border: "none", borderRadius: "9px", background: tab === tb.id ? (tb.id === "impact" ? "linear-gradient(135deg, #8B4513, #D2691E)" : "#faf6f0") : "transparent", color: tab === tb.id ? (tb.id === "impact" ? "#fff" : "#2c1810") : "#7a6b5d", fontWeight: tab === tb.id ? 700 : 500, fontSize: "13px", cursor: "pointer", fontFamily: "'DM Sans', sans-serif", transition: "all 0.3s ease", boxShadow: tab === tb.id ? "0 2px 8px rgba(0,0,0,0.08)" : "none", whiteSpace: "nowrap" }}>{t(tb.label, lang)}</button>))}
          </div>
        </div>

        {/* Content */}
        <div style={{ maxWidth: "1000px", margin: "0 auto", padding: "24px 24px 60px" }}>

          {tab === "overview" && (<div style={{ animation: "fadeIn 0.5s ease" }}>
            <h2 style={{ fontSize: "26px", fontWeight: 800, color: "#2c1810", margin: "0 0 8px" }}>{t(UI.overviewTitle, lang)}</h2>
            <p style={{ fontSize: "15px", color: "#6b5b4d", lineHeight: 1.7, marginBottom: "24px" }} dangerouslySetInnerHTML={{ __html: t(UI.overviewDesc, lang).replace(t(UI.priorityProducers, lang), `<strong style="color:#2c1810">${t(UI.priorityProducers, lang)}</strong>`) }} />
            <h3 style={{ fontSize: "18px", fontWeight: 700, color: "#2c1810", margin: "24px 0 16px" }}>{t(UI.recsBySection, lang)}</h3>
            <DonutChart />
            <h3 style={{ fontSize: "18px", fontWeight: 700, color: "#2c1810", margin: "32px 0 16px" }}>{t(UI.sixAreas, lang)}</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: "16px" }}>
              {SECTIONS.map((s, i) => (<SectionCard key={s.id} section={s} onClick={() => { setActiveSection(i); setTab("recommendations"); }} />))}
            </div>
          </div>)}

          {tab === "recommendations" && (<div style={{ animation: "fadeIn 0.5s ease" }}>
            <h2 style={{ fontSize: "26px", fontWeight: 800, color: "#2c1810", margin: "0 0 4px" }}>{t(UI.all26, lang)}</h2>
            <p style={{ fontSize: "14px", color: "#7a6b5d", marginBottom: "20px" }}>{t(UI.selectSection, lang)}</p>
            <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", marginBottom: "20px" }}>
              {SECTIONS.map((s, i) => (<button key={s.id} onClick={() => setActiveSection(i)} style={{ padding: "8px 16px", border: activeSection === i ? `2px solid ${s.color}` : "2px solid #e8ddd0", borderRadius: "10px", background: activeSection === i ? `${s.color}12` : "#faf6f0", cursor: "pointer", fontSize: "13px", fontFamily: "'DM Sans', sans-serif", fontWeight: activeSection === i ? 700 : 500, color: activeSection === i ? s.color : "#7a6b5d", transition: "all 0.3s ease", display: "flex", alignItems: "center", gap: "6px" }}>{s.icon} {s.id}. {t(s.title, lang)}</button>))}
            </div>
            <RecDetail section={SECTIONS[activeSection]} />
          </div>)}

          {tab === "data" && (<div style={{ animation: "fadeIn 0.5s ease" }}>
            <h2 style={{ fontSize: "26px", fontWeight: 800, color: "#2c1810", margin: "0 0 4px" }}>{t(UI.dataTitle, lang)}</h2>
            <p style={{ fontSize: "14px", color: "#7a6b5d", marginBottom: "24px" }}>{t(UI.dataDesc, lang)}</p>
            <div style={{ background: "#faf6f0", border: "2px solid #e8ddd0", borderRadius: "16px", padding: "28px", marginBottom: "20px" }}>
              <h3 style={{ margin: "0 0 4px", fontSize: "18px", color: "#2c1810" }}>{t(UI.ownershipTitle, lang)}</h3>
              <p style={{ fontSize: "12px", color: "#7a6b5d", margin: "0 0 20px" }}>{t(UI.ownershipDesc, lang)}</p>
              <BarChart data={OWNERSHIP_DATA} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: "16px", marginBottom: "20px" }}>
              {DATA_STATS.map((s, i) => (<div key={i} style={{ background: "#faf6f0", border: "2px solid #e8ddd0", borderRadius: "14px", padding: "20px", textAlign: "center", transition: "transform 0.2s ease" }} onMouseEnter={e => e.currentTarget.style.transform = "translateY(-4px)"} onMouseLeave={e => e.currentTarget.style.transform = "translateY(0)"}><div style={{ fontSize: "32px", fontWeight: 800, color: s.color, fontFamily: "'DM Sans', sans-serif" }}>{s.value}</div><div style={{ fontSize: "12px", color: "#6b5b4d", marginTop: "6px", lineHeight: 1.4 }}>{t(s.label, lang)}</div></div>))}
            </div>
            <div style={{ background: "linear-gradient(135deg, #2c1810, #4a3728)", borderRadius: "16px", padding: "28px", color: "#faf6f0" }}>
              <h3 style={{ margin: "0 0 16px", fontSize: "18px", color: "#E8A952" }}>{t(UI.consolidationTitle, lang)}</h3>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px" }}>
                <div>
                  <div style={{ fontSize: "11px", color: "#c9b99a", textTransform: "uppercase", letterSpacing: "1px", fontFamily: "'DM Sans', sans-serif", marginBottom: "8px" }}>{t(UI.smallOwners, lang)}</div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: "8px" }}><span style={{ fontSize: "36px", fontWeight: 800, color: "#E8A952", fontFamily: "'DM Sans', sans-serif" }}>63.5%</span><span style={{ fontSize: "13px", color: "#c9b99a" }}>{t(UI.ofLandowners, lang)}</span></div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: "8px", marginTop: "4px" }}><span style={{ fontSize: "36px", fontWeight: 800, color: "#83C5BE", fontFamily: "'DM Sans', sans-serif" }}>9.9%</span><span style={{ fontSize: "13px", color: "#c9b99a" }}>{t(UI.ofCropland, lang)}</span></div>
                </div>
                <div>
                  <div style={{ fontSize: "11px", color: "#c9b99a", textTransform: "uppercase", letterSpacing: "1px", fontFamily: "'DM Sans', sans-serif", marginBottom: "8px" }}>{t(UI.largeOwners, lang)}</div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: "8px" }}><span style={{ fontSize: "36px", fontWeight: 800, color: "#E8A952", fontFamily: "'DM Sans', sans-serif" }}>4.6%</span><span style={{ fontSize: "13px", color: "#c9b99a" }}>{t(UI.ofLandowners, lang)}</span></div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: "8px", marginTop: "4px" }}><span style={{ fontSize: "36px", fontWeight: 800, color: "#83C5BE", fontFamily: "'DM Sans', sans-serif" }}>48.9%</span><span style={{ fontSize: "13px", color: "#c9b99a" }}>{t(UI.ofCropland, lang)}</span></div>
                </div>
              </div>
            </div>
          </div>)}

          {tab === "timeline" && (<div style={{ animation: "fadeIn 0.5s ease" }}>
            <h2 style={{ fontSize: "26px", fontWeight: 800, color: "#2c1810", margin: "0 0 4px" }}>{t(UI.historyTitle, lang)}</h2>
            <p style={{ fontSize: "14px", color: "#7a6b5d", marginBottom: "28px" }}>{t(UI.historyDesc, lang)}</p>
            <div style={{ position: "relative", maxWidth: "700px", margin: "0 auto" }}>
              <div style={{ position: "absolute", left: "50%", top: 0, bottom: 0, width: "2px", background: "linear-gradient(180deg, #8B4513, #D2691E, #E8A952)", transform: "translateX(-50%)" }} />
              <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                {TIMELINE.map((e, i) => <TimelineItem key={i} year={e.year} text={e.text} side={i % 2 === 0 ? "left" : "right"} />)}
              </div>
            </div>
            <div style={{ marginTop: "36px", background: "#faf6f0", border: "2px solid #e8ddd0", borderRadius: "16px", padding: "24px" }}>
              <h3 style={{ margin: "0 0 12px", fontSize: "18px", color: "#2c1810" }}>{t(UI.commAffected, lang)}</h3>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: "14px" }}>
                {COMMUNITIES.map((c, i) => (<div key={i} style={{ padding: "16px", background: "#fff", border: "1px solid #e8ddd0", borderRadius: "12px", borderTop: `3px solid ${commColors[i]}` }}><div style={{ fontWeight: 700, fontSize: "14px", color: "#2c1810", marginBottom: "6px" }}>{t(c.group, lang)}</div><div style={{ fontSize: "12px", color: "#6b5b4d", lineHeight: 1.5 }}>{t(c.impact, lang)}</div></div>))}
              </div>
            </div>
          </div>)}

          {tab === "impact" && <PersonalImpactSection />}
        </div>

        <div style={{ background: "#2c1810", padding: "20px 24px", textAlign: "center", fontSize: "12px", color: "#7a6b5d", fontFamily: "'DM Sans', sans-serif" }}>
          <div>{t(UI.footer, lang)}</div>
          <a href="https://sgc.ca.gov/wp-content/uploads/ALETF-Final-Report_Dec-11-2025.pdf" target="_blank" rel="noopener noreferrer" style={{ color: "#E8A952", textDecoration: "none", fontSize: "12px", marginTop: "6px", display: "inline-block" }}>📄 {t(UI.readReport, lang)} ↗</a>
        </div>
      </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
